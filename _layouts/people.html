---
layout: people
---

<article class="pplCard">
	<div class="pplMedia">
		<img class="pplImg" src="{{ site.baseurl }}/assets/people/{{ page.img }}" alt="{{ page.title }}" />
	</div>

	<div class="pplDesc">
		<h3 class="pplName">{{ page.title }}</h3>
		<div class="pplBody">{{ content }}</div>
	</div>
</article>
