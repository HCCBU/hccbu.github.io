<div class="conference-map-page">


  <div class="map-layout">
    <div id="conference-map-canvas" class="map-canvas" aria-label="Conference events map"></div>
    
    <aside id="map-sidebar" class="map-sidebar">
      <button id="map-sidebar-close" class="map-sidebar__close" type="button" aria-label="Close" hidden>
        <i class="fa-solid fa-xmark"></i>
      </button>
      
      <div id="map-empty-state" class="map-empty-state">
        <h2>Select a location</h2>
        <p class="muted">Click a pin on the map to view details.</p>
      </div>
      
      <article id="map-detail" class="map-detail" aria-live="polite">
        <h2 id="map-detail-name"></h2>
        
 
        <section class="map-detail__section">
          <h3>Location</h3>
          <p><strong>City:</strong> <span id="map-detail-city"></span></p>
          <p><strong>Country:</strong> <span id="map-detail-country"></span></p>
        </section>
        
        <div class="map-detail__chips">
          <a id="map-detail-events-link" class="map-detail__chip" href="#" hidden></a>
          <a id="map-detail-pub-link" class="map-detail__chip" href="#" hidden></a>
        </div>
      </article>
    </aside>
  </div>
</div>

<script id="conference-map-data" type="application/json">
[
{% assign events_items = site.events | where_exp: "item", "item.conference_map" | sort: "date" | reverse %}
{% assign post_items = site.posts | where_exp: "item", "item.conference_map" | sort: "date" | reverse %}
{% assign separator = "" %}
{% for item in events_items %}
  {% assign raw_map_image = item.conference_map.image | default: item.conference_map.thumbnail | default: item.image %}
  {% assign raw_publication_url = item.conference_map.publication_url %}
  {% assign raw_events_label = item.conference_map.events_label | default: "Events post" %}
  {% assign raw_publication_label = item.conference_map.publication_label | default: "Publications" %}
  {% capture raw_event_title %}{{ item.conference_map.city }} {{ item.conference_map.year }}{% endcapture %}

  
  {% if raw_publication_url %}
    {% if raw_publication_url contains '://' %}
      {% assign publication_url = raw_publication_url %}
    {% else %}
      {% assign publication_url = raw_publication_url | prepend: site.baseurl %}
    {% endif %}
  {% else %}
    {% assign publication_url = nil %}
  {% endif %}

  {{ separator }}
  {
    "kind": "events",
    "location_id": {{ item.conference_map.location_id | jsonify }},
    "city": {{ item.conference_map.city | jsonify }},
    "country": {{ item.conference_map.country | jsonify }},
    "lat": {{ item.conference_map.lat | jsonify }},
    "lng": {{ item.conference_map.lng | jsonify }},
    "conference": {{ item.conference_map.conference | jsonify }},
    "year": {{ item.conference_map.year | jsonify }},
    "event_title": {{ item.conference_map.event_title | default: raw_event_title | strip | jsonify }},
    "title": {{ item.title | jsonify }},
    "events_url": {{ item.url | prepend: site.baseurl | jsonify }},
    "events_label": {{ raw_events_label | jsonify }},
    "publication_url": {{ publication_url | jsonify }},
    "publication_label": {{ raw_publication_label | jsonify }},
    "image_url": {{ map_image_url | jsonify }}
  }
  {% assign separator = "," %}
{% endfor %}
{% for item in post_items %}
  {% assign raw_map_image = item.conference_map.image | default: item.conference_map.thumbnail | default: item.image %}
  {% assign raw_publication_url = item.conference_map.publication_url | default: item.url %}
  {% assign raw_publication_label = item.conference_map.publication_label | default: "Publications" %}
  {% capture raw_event_title %}{{ item.conference_map.city }} {{ item.conference_map.year }}{% endcapture %}

  {% if raw_map_image %}
    {% if raw_map_image contains '://' or raw_map_image contains '/' %}
      {% assign map_image_url = raw_map_image %}
    {% else %}
      {% assign map_image_url = raw_map_image | prepend: '/assets/images/' | prepend: site.baseurl %}
    {% endif %}
  {% else %}
    {% assign map_image_url = nil %}
  {% endif %}

  {% if raw_publication_url contains '://' %}
    {% assign publication_url = raw_publication_url %}
  {% else %}
    {% assign publication_url = raw_publication_url | prepend: site.baseurl %}
  {% endif %}

  {{ separator }}
  {
    "kind": "publication",
    "location_id": {{ item.conference_map.location_id | jsonify }},
    "city": {{ item.conference_map.city | jsonify }},
    "country": {{ item.conference_map.country | jsonify }},
    "lat": {{ item.conference_map.lat | jsonify }},
    "lng": {{ item.conference_map.lng | jsonify }},
    "conference": {{ item.conference_map.conference | jsonify }},
    "year": {{ item.conference_map.year | jsonify }},
    "event_title": {{ item.conference_map.event_title | default: raw_event_title | strip | jsonify }},
    "title": {{ item.title | jsonify }},
    "publication_url": {{ publication_url | jsonify }},
    "publication_label": {{ raw_publication_label | jsonify }},
    "image_url": {{ map_image_url | jsonify }}
  }
  {% assign separator = "," %}
{% endfor %}
]
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="{{ site.baseurl }}/public/js/conference-map.js"></script>
